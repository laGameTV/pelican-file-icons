name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: none
          coverage: none

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The build downloads the Datapack Icons VSIX from the Visual Studio Marketplace into
      # scripts/.cache (network access needed on a cache miss). The build verifies the SHA-256
      # pinned in scripts/data/sources.json, so a stale or tampered cache entry fails the build.
      - name: Cache downloaded theme sources
        uses: actions/cache@v6
        with:
          path: scripts/.cache
          key: theme-sources-${{ hashFiles('scripts/data/sources.json') }}

      - name: Build data and icons
        run: bun run build

      - name: Check that generated files are up to date
        run: |
          # Make new (untracked) files visible to git diff as well.
          git add --intent-to-add -- resources
          if ! git diff --exit-code --stat -- resources; then
            echo "::error::resources/ is out of date. Run 'bun run build' and commit the result."
            exit 1
          fi

      - name: Run tests
        env:
          PHP_BINARY: php
        run: bun run test

  lint:
    name: Lint (panel ${{ matrix.panel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The release this plugin is tested against, and the development branch.
        panel: [ v1.0.0-rc.3, main ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate plugin.json
        run: php .github/scripts/validate-plugin-json.php

      - name: Install Laravel Pint
        run: |
          mkdir -p "$RUNNER_TEMP/pint"
          composer require --working-dir="$RUNNER_TEMP/pint" --no-interaction --no-progress "laravel/pint:^1.29"

      - name: Run Pint
        run: '"$RUNNER_TEMP/pint/vendor/bin/pint" --test'

      - name: Clone Pelican Panel
        run: git clone --depth=1 --branch "${{ matrix.panel }}" https://github.com/pelican/panel.git "$RUNNER_TEMP/pelican"

      - name: Install panel dependencies
        working-directory: ${{ runner.temp }}/pelican
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Setup .env file
        working-directory: ${{ runner.temp }}/pelican
        run: cp .env.example .env

      - name: Copy plugin into the panel
        working-directory: ${{ runner.temp }}/pelican
        run: |
          mkdir -p plugins/file-icons
          rsync -a --delete --exclude=.git --exclude=node_modules "$GITHUB_WORKSPACE/" plugins/file-icons/

      - name: Run PHPStan
        working-directory: ${{ runner.temp }}/pelican
        run: vendor/bin/phpstan analyse --configuration=plugins/file-icons/phpstan.neon --memory-limit=-1 --error-format=github --no-progress
