name: Release

# Push a tag like v1.2.3 (matching "version" in plugin.json) to publish a release.
# The release gets two files:
#   file-icons-<version>.zip  the plugin
#   file-icons.zip            the same zip under a fixed name, for .../releases/latest/download/file-icons.zip
# Updates are delivered through the Pelican Plugin Hub (update_url in plugin.json): sync the release on the
# Hub after it has been published.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check that the tag matches plugin.json
        run: |
          version="$(jq -r .version plugin.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in plugin.json."
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: none
          coverage: none

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache downloaded theme sources
        uses: actions/cache@v6
        with:
          path: scripts/.cache
          key: theme-sources-${{ hashFiles('scripts/data/sources.json') }}

      - name: Build data and icons
        run: bun run build

      - name: Check that generated files are committed
        run: |
          git add --intent-to-add -- resources
          if ! git diff --exit-code --stat -- resources; then
            echo "::error::resources/ is out of date. Run 'bun run build' and commit the result before tagging."
            exit 1
          fi

      - name: Run tests
        env:
          PHP_BINARY: php
        run: bun run test

      - name: Build the release zip
        run: |
          bun scripts/release.ts
          cp "dist/file-icons-${VERSION}.zip" dist/file-icons.zip

      - name: Write the release notes
        run: |
          # The CHANGELOG section of this version, without its heading.
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          sha256="$(sha256sum "dist/file-icons-${VERSION}.zip" | cut -d' ' -f1)"
          cat >> dist/notes.md <<EOF

          ### Install or update

          - **Update:** once the release is on the Pelican Plugin Hub, the panel shows an *Update* button in
            **Admin → Plugins**.
          - **New install:** install it from the [Plugin Hub](https://hub.pelican.dev/plugins/file-icons), or in
            **Admin → Plugins** choose **Import from URL** and paste
            \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/file-icons.zip\`,
            then choose **Install** in the plugin's actions menu.

          SHA-256 of \`file-icons-${VERSION}.zip\`: \`${sha256}\`
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/file-icons-${VERSION}.zip" \
            dist/file-icons.zip \
            --title "File Icons ${VERSION}" \
            --notes-file dist/notes.md \
            --verify-tag
